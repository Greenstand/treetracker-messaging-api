name: Service CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  project-directory: ./

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: node:10.18-jessie

    services:
      postgres:
        image: postgis/postgis
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository_owner == 'Greenstand'
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'

      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}

      - name: run ESLint
        run: npm run lint
        working-directory: ${{ env.project-directory }}

      - name: run db-migrate
        run: npm run db-migrate-ci
        working-directory: ${{ env.project-directory }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres/postgres

      - name: run integration tests
        run: npm run test-integration-ci
        working-directory: ${{ env.project-directory }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres/postgres
          CI: true

      - name: run repository tests
        run: npm run test-repository
        working-directory: ${{ env.project-directory }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres/postgres
          CI: true

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository_owner == 'Greenstand'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}

      - name: Install release tools
        run: npm i -g semantic-release @semantic-release/git @semantic-release/exec @semantic-release/changelog

      - name: Run semantic-release
        id: semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: greenstand/${{ github.event.repository.name }}:${{ steps.semantic-release.outputs.new-release-version }}

      - name: Install kustomize
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Update development image tag
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          IMAGE_NAME: greenstand/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.semantic-release.outputs.new-release-version }}
        run: |
          cd deployment/overlays/development
          ../../../kustomize edit set image "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Commit development image tag
        id: commit-image-tag
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          IMAGE_TAG: ${{ steps.semantic-release.outputs.new-release-version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add deployment/overlays/development
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump docker image tag ${IMAGE_TAG} [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit-image-tag.outputs.committed == 'true'
        run: git push origin HEAD:main
